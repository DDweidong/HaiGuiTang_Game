# 开发环境配置
spring:
  data:
    redis:
      # 本地开发: WSL2 Ubuntu 内 Docker 跑的 Redis，端口已映射到 Windows localhost。
      # 必须写 127.0.0.1: Java 解析 localhost 优先走 IPv6 ::1，而 WSL2 只把 IPv4 转发到 Windows，
      # 连 IPv6 会失败（PowerShell 等客户端会自动 fallback 所以不易察觉）
      host: 127.0.0.1
      port: 6379
  datasource:
    # allowPublicKeyRetrieval: MySQL 8 默认 caching_sha2_password，本地无 SSL 时需允许取公钥（仅开发环境）
    url: jdbc:mysql://localhost:3306/haiguitang?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 数据库密码走环境变量 DB_PASSWORD（IDEA 运行配置或系统环境变量中设置）
    password: ${DB_PASSWORD}
  flyway:
    # 开发库已存在手工建的表，用 baseline 标记为已迁移，避免 V1 重复执行报错；
    # 全新数据库不受影响，V1 正常执行
    baseline-on-migrate: true

logging:
  level:
    # 开发环境打印本项目的调试日志
    com.weidong.gamebackend: debug

jwt:
  # 开发默认密钥（仅本地可用，HS256 要求至少 32 字节）；生产必须由环境变量注入
  secret: ${JWT_SECRET:dev-only-jwt-secret-0123456789abcdefghijklmn}
