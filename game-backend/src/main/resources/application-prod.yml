# 生产环境配置: 所有敏感信息均来自环境变量，由部署平台注入
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 部署平台 Redis 无密码时置空
      password: ${REDIS_PASSWORD:}
  datasource:
    # MySQL 8 默认 caching_sha2_password, 无 SSL 时首次连接需允许取公钥
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:haiguitang}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    com.weidong.gamebackend: info

springdoc:
  # 生产环境关闭接口文档与调试页面，避免暴露接口细节
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  # 生产密钥必须由部署平台注入（无默认值，缺失则启动失败，防止误用开发密钥）
  secret: ${JWT_SECRET}
