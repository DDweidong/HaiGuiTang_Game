spring:
  application:
    name: game-backend
  # 通过环境变量切换环境，默认 dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 数据库下划线字段(user_id) 自动映射实体驼峰属性(userId)
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J，统一日志出口
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# 阿里云百炼(通义千问) 大模型接入
langchain4j:
  community:
    dashscope:
      chat-model:
        # API Key 必须走环境变量，禁止写入配置文件
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: qwen-max

# 接口文档(Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# JWT: 双 token 有效期（毫秒）。密钥按环境区分，见 dev/prod profile
jwt:
  # access: 30 分钟，控制凭据暴露窗口；refresh: 7 天，减少重复登录
  access-expiration: 1800000
  refresh-expiration: 604800000

# 接口限流: LLM 按 token 计费，/chat 是唯一直接消耗模型费用的接口，需防脚本刷量
hgt:
  rate-limit:
    chat:
      # 每窗口允许的请求数。正常玩家受 LLM 生成耗时(10~30s)约束，每分钟最多 2~3 条，
      # 10 条已留足余量，同时限制脚本批量调用
      max-requests: 10
      # 固定窗口时长（秒）
      window-seconds: 60
  # token 成本估算单价（元/百万 token），qwen-max 官方定价（2026-09 阿里云百炼），调价时改这里即可
  pricing:
    input-yuan-per-1m: 2.4
    output-yuan-per-1m: 9.6
