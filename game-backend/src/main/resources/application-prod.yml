# 生产环境配置: 所有敏感信息均来自环境变量，由部署平台注入
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:haiguitang}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    com.weidong.gamebackend: info

springdoc:
  # 生产环境关闭接口文档与调试页面，避免暴露接口细节
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  # 生产密钥必须由部署平台注入（无默认值，缺失则启动失败，防止误用开发密钥）
  secret: ${JWT_SECRET}
